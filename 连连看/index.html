<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#eef1f8" />
    <title>连连看 · 游戏大厅</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%234f46e5'/%3E%3Ctext x='32' y='45' font-size='32' text-anchor='middle' fill='white'%3E%F0%9F%A7%A9%3C/text%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="styles.css?v=20261027-2" />
  </head>
  <body>
    <div class="bg-orbs" aria-hidden="true"><span></span><span></span><span></span></div>

    <div class="app">
      <header class="topbar">
        <a class="back-home" href="../" title="返回游戏大厅">← 大厅</a>
        <div class="brand">
          <div class="logo">🧩</div>
          <div class="brand-text">
            <h1>连连看</h1>
            <p>两个相同图案 · 连线最多拐两次</p>
          </div>
        </div>
        <div class="hud">
          <div class="stat">
            <span>剩余</span>
            <b id="pairsLeft">24</b>
          </div>
          <div class="stat">
            <span>得分</span>
            <b id="score">0</b>
          </div>
          <div class="stat">
            <span>时间</span>
            <b id="timer">03:00</b>
          </div>
        </div>
      </header>

      <main class="stage">
        <div class="board-shell" id="boardShell">
          <div class="board" id="board"></div>
          <svg class="paths" id="paths" viewBox="0 0 8.56 6.56" preserveAspectRatio="none" aria-hidden="true"></svg>
        </div>
        <p class="tip">点两个相同图案 · 连线最多拐两次 · 可以绕棋盘外圈</p>
      </main>

      <footer class="actions">
        <button class="btn" id="btnHint">提示 <span id="hintLeft">3</span></button>
        <button class="btn" id="btnShuffle">重排 <span id="shuffleLeft">2</span></button>
        <button class="btn primary" id="btnRestart">重新开始</button>
      </footer>
    </div>

    <div class="modal" id="modal" aria-hidden="true">
      <div class="modal-card">
        <div class="modal-emoji" id="modalEmoji">🎉</div>
        <h2 id="modalTitle">全部消除</h2>
        <p id="modalText">用时 00:00 · 得分 0</p>
        <div class="modal-actions">
          <button class="btn primary" id="btnAgain">再来一局</button>
          <a class="btn ghost" href="../">回大厅</a>
        </div>
      </div>
    </div>

    <div class="toast-stack" id="toasts"></div>

    <script src="game.js?v=20261027-2"></script>
  </body>
</html>
