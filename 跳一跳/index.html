<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#eef1f8" />
    <title>跳一跳 · 游戏大厅</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%234f46e5'/%3E%3Ctext x='32' y='45' font-size='30' text-anchor='middle' fill='white'%3E%F0%9F%90%A4%3C/text%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="styles.css?v=20261027-15" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <a class="back-home" href="../" title="返回游戏大厅">← 大厅</a>
        <div class="brand">
          <div class="logo">🐤</div>
          <div class="brand-text">
            <h1>跳一跳</h1>
            <p>按住蓄力 · 松开起跳</p>
          </div>
        </div>
        <div class="hud">
          <div class="stat">
            <span>本局</span>
            <b id="score">0</b>
          </div>
          <div class="stat">
            <span>最佳</span>
            <b id="best">0</b>
          </div>
          <button class="net-btn" id="btnNet">联机</button>
        </div>
      </header>

      <main class="stage">
        <canvas id="game"></canvas>

        <div class="tip" id="tip">按住蓄力，松手起跳</div>

        <div class="opp hidden" id="opp">
          <div class="opp-line">
            <span>你</span><b id="oppMe">0</b>
          </div>
          <div class="opp-line">
            <span id="oppName">对手</span><b id="oppScore">0</b>
          </div>
          <div class="opp-track"><i id="oppBar"></i></div>
          <div class="opp-goal">先到 20 层</div>
        </div>
      </main>
    </div>

    <div class="modal" id="modal" aria-hidden="true">
      <div class="modal-card">
        <div class="modal-emoji" id="moEmoji">😵</div>
        <h2 id="moTitle">掉下去了</h2>
        <p id="moText">本局 0 层</p>
        <div class="modal-actions">
          <button class="btn primary" id="moAgain">再来一局</button>
          <a class="btn ghost" href="../">回大厅</a>
        </div>
      </div>
    </div>

    <div class="modal" id="netModal" aria-hidden="true">
      <div class="modal-card net-card">
        <h2>联机对战</h2>
        <p class="net-sub">同一个关卡，先到 20 层的人赢</p>

        <div id="netEntry">
          <button class="btn primary wide" id="btnCreateRoom">创建房间</button>
          <div class="join-row">
            <input id="roomCode" placeholder="输入 4 位房号" maxlength="4" autocomplete="off" />
            <button class="btn" id="btnJoinRoom">加入</button>
          </div>
        </div>

        <div id="netRoom" class="hidden">
          <div class="code-line">房间号 <b id="netCodeLabel">----</b></div>
          <div class="net-players" id="netPlayers"></div>
          <div class="net-actions">
            <button class="btn" id="btnCopyInvite">复制邀请链接</button>
            <button class="btn primary" id="btnStartRace">开始</button>
          </div>
          <p class="net-hint" id="netHint">等好友进来…</p>
        </div>

        <button class="btn ghost wide" id="btnCloseNet">关闭</button>
      </div>
    </div>

    <div class="toast-stack" id="toasts"></div>

    <script src="../猜数字/config.js?v=20261027-15"></script>
    <script src="../猜数字/net-lite.js?v=20261027-15"></script>
    <script src="../猜数字/hub-friends.js?v=20261027-15"></script>
    <script src="game.js?v=20261027-15"></script>
  </body>
</html>
