<!DOCTYPE html><html><head><meta charset="utf-8"><style>html,body{margin:0;height:100%}#scene{position:absolute;inset:0}</style></head>
<body><div id="scene"></div>
<script src="vendor/three.min.js"></script>
<script src="src/data.js"></script>
<script src="src/path.js"></script>
<script src="src/scene.js"></script>
<script>
window.onerror=function(m,s,l,c,e){document.title='ERR '+(e&&e.stack?e.stack.split('\n')[0]:m)+' @'+l;};
try{
  Scene3D.init(document.getElementById('scene'),{});
  Scene3D.buildAllPins();
  Scene3D.focusFloor('MZ1',{camera:false});
  setTimeout(function(){Scene3D.showCampus();},300);
  setTimeout(function(){
    var d=Scene3D.debug();
    document.title = d.error ? ('LOOPERR ' + d.error.split('\n')[0]) : 'OK orbit';
  },1200);
}catch(e){ document.title='INITERR '+e.message; }
</script></body></html>
