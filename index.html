<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#eef1f8" />
    <title>游戏大厅</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%234f46e5'/%3E%3Ctext x='32' y='45' font-size='34' text-anchor='middle' fill='white'%3E%F0%9F%8E%AE%3C/text%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="lobby.css?v=20261027-15" />
  </head>
  <body>
    <div class="bg-orbs" aria-hidden="true"><span></span><span></span><span></span></div>

    <div class="app">
      <header class="hero">
        <div class="hero-head">
          <div class="brand">
            <div class="logo">🎮</div>
            <div class="brand-text">
              <h1>游戏大厅</h1>
              <p>和好友一起玩</p>
            </div>
          </div>

          <div class="hero-right">
            <span class="pill"><i class="dot"></i><span id="onlineCount">0</span></span>
            <button class="friend-btn" id="btnFriends">
              <span class="fb-icon">👥</span>
              <span class="fb-text">好友</span>
              <b class="fb-badge hidden" id="friendBadge">0</b>
            </button>
            <button class="icon-btn" id="btnSound" title="音效">🔔</button>
          </div>
        </div>

        <div class="me">
          <div class="me-avatar" id="meAvatar">玩</div>
          <div class="me-main">
            <input id="meNick" class="me-nick" maxlength="12" aria-label="昵称" />
            <div class="me-code">号码 <b id="meId">----</b></div>
          </div>
          <button class="me-copy" id="copyId">复制号码</button>
        </div>
      </header>

      <!-- 在线好友：一眼看到谁在线、在玩什么，点开就能聊或直接邀请 -->
      <section class="online-strip hidden" id="onlineStrip">
        <div class="os-head">
          <span class="os-dot"></span>
          <b>在线好友</b>
          <span class="os-count" id="onlineFriendsCount">0</span>
        </div>
        <div class="os-list" id="onlineFriends"></div>
      </section>

      <main class="layout">
        <section class="panel games-panel">
          <div class="panel-head">
            <div>
              <h2>游戏</h2>
              <p class="sub">点开就能玩，联机的可以喊上好友</p>
            </div>
            <span class="count-badge" id="gameCount">0 款</span>
          </div>
          <div class="game-grid" id="gameGrid"></div>

          <div class="panel-head mt">
            <div>
              <h2>其他项目</h2>
              <p class="sub">这个站点里的其他页面</p>
            </div>
          </div>
          <div class="mini-links" id="miniLinks"></div>
        </section>
      </main>

      <footer class="hub-foot">
        好友与聊天记录只保存在你的浏览器 · 把站点放到公网，随时约朋友一起玩
      </footer>
    </div>

    <!-- 好友面板：列表 / 聊天 二合一 -->
    <div class="friend-sheet" id="friendSheet" aria-hidden="true">
      <div class="sheet-backdrop" id="sheetBackdrop"></div>
      <aside class="sheet-panel" role="dialog" aria-label="好友">
        <div class="fs-view" id="fsListView">
          <div class="fs-head">
            <h2>好友</h2>
            <span class="fs-count" id="friendCount">0</span>
            <button class="fs-close" id="btnCloseFriends" aria-label="关闭">✕</button>
          </div>

          <div class="add-row">
            <input id="friendCode" placeholder="输入好友号码…" maxlength="16" autocomplete="off" />
            <button class="btn-add" id="btnAddFriend">添加</button>
          </div>

          <div class="friend-list" id="friendList"></div>

          <div class="friend-empty" id="friendEmpty">
            <div class="fe-icon">👋</div>
            <p>还没有好友</p>
            <span>把你的号码 <b id="emptyId">----</b> 发给朋友，互相添加就能聊天</span>
          </div>
        </div>

        <div class="fs-view chat-view" id="fsChatView">
          <div class="fs-head chat-head">
            <button class="fs-back" id="btnChatBack" aria-label="返回好友列表">←</button>
            <div class="chat-title">
              <b id="chatName">好友</b>
              <span id="chatState">离线</span>
            </div>
            <button class="chat-invite" id="btnInvite">一起玩</button>
          </div>
          <div class="chat-body" id="chatBody"></div>
          <div class="emoji-panel" id="emojiPanel" aria-hidden="true"></div>
          <form class="chat-input" id="chatForm">
            <button type="button" class="emoji-btn" id="btnEmoji" aria-label="表情" title="表情">😊</button>
            <input id="chatInput" placeholder="发消息…" maxlength="500" autocomplete="off" />
            <button type="submit" id="btnSend">发送</button>
          </form>
        </div>
      </aside>
    </div>

    <!-- 邀请横幅 -->
    <div class="invite-banner" id="inviteBanner">
      <div class="ib-avatar" id="ibAvatar">友</div>
      <div class="ib-text">
        <b id="ibFrom">好友</b> 邀请你一起玩「<span id="ibGame">猜数字</span>」
        <small>房间号 <span id="ibCode">----</span></small>
      </div>
      <div class="ib-actions">
        <button class="ib-accept" id="ibAccept">接受</button>
        <button class="ib-ignore" id="ibIgnore">忽略</button>
      </div>
    </div>

    <div class="toast-stack" id="toasts"></div>

    <!-- 邀请：选一个要一起玩的游戏 -->
    <div class="game-picker" id="gamePicker" aria-hidden="true">
      <div class="gp-backdrop" data-gpclose></div>
      <div class="gp-card" role="dialog" aria-label="选择游戏">
        <div class="gp-head">
          <div>
            <h3>邀请一起玩</h3>
            <p id="gpSub">选择游戏</p>
          </div>
          <button class="fs-close" data-gpclose aria-label="关闭">✕</button>
        </div>
        <div class="gp-list" id="gpList"></div>
        <div class="gp-foot"><button type="button" class="gp-cancel" data-gpclose>取消</button></div>
      </div>
    </div>

    <script src="猜数字/net-lite.js?v=20261027-15"></script>
    <script src="猜数字/config.js?v=20261027-15"></script>
    <script src="lobby.js?v=20261027-15"></script>
  </body>
</html>
