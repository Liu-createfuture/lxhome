<style>
:root{

/* ================= 侧边栏 ================= */
#sidebar{
  width:264px;flex:0 0 264px;background:var(--sb-bg);border-right:1px solid var(--line);
  overflow:hidden;transition:flex-basis .3s cubic-bezier(.22,.8,.28,1),opacity .22s ease;
  position:relative;z-index:40;
}
#sbInner{width:264px;height:100%;display:flex;flex-direction:column}
body.sb-collapsed #sidebar{flex-basis:0;opacity:0;pointer-events:none}
.sb-top{padding:16px 16px 10px;display:flex;align-items:center;gap:9px}
.brand{display:flex;align-items:center;gap:9px;min-width:0}
.brand-mark{
  width:30px;height:30px;border-radius:9px;flex:0 0 30px;
  background:linear-gradient(135deg,#4D6BFE,#8B5CF6);display:flex;align-items:center;justify-content:center;
  box-shadow:0 3px 10px rgba(77,107,254,.28);
}
.brand-mark svg{width:18px;height:18px}
.brand-name{font-size:15px;font-weight:650;letter-spacing:.2px;color:var(--tx)}
.brand-tag{
  font-size:10px;color:var(--blue);background:var(--blue-soft);border:1px solid #DDE5FF;
  padding:1px 6px;border-radius:6px;margin-left:1px;font-weight:600;vertical-align:1px;
}
.new-chat{
  margin:6px 12px 12px;display:flex;align-items:center;gap:8px;justify-content:center;
  height:38px;border-radius:11px;border:1px solid var(--line-2);background:#fff;
  color:var(--tx);font-size:13.5px;font-weight:550;cursor:pointer;
  transition:background .16s,border-color .16s,color .16s,transform .12s;
  box-shadow:var(--shadow-sm);
}
.new-chat:hover{background:var(--blue-soft-2);border-color:#CFD9FF;color:var(--blue)}
.new-chat:active{transform:scale(.985)}
.new-chat svg{width:16px;height:16px}
.sb-scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:2px 8px 8px}
.sb-group{
  padding:14px 10px 6px;font-size:11.5px;color:var(--tx-3);font-weight:500;letter-spacing:.2px;
}
.sb-item{
  position:relative;display:flex;align-items:center;gap:8px;height:36px;
  padding:0 8px 0 10px;border-radius:9px;font-size:13.5px;color:var(--tx-2);
  cursor:pointer;transition:background .14s,color .14s;user-select:none;
}
.sb-item:hover{background:#EFF1F6;color:var(--tx)}
.sb-item.active{background:#E8EDFF;color:var(--blue);font-weight:550}
.sb-item .t{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;line-height:1.4}
.sb-item input.rename{
  flex:1;min-width:0;border:1px solid var(--blue);background:#fff;border-radius:6px;
  font-size:13px;padding:2px 6px;color:var(--tx);outline:none;font-family:inherit;
}
.sb-more{
  width:22px;height:22px;flex:0 0 22px;border:none;background:transparent;border-radius:6px;
  color:var(--tx-3);cursor:pointer;display:flex;align-items:center;justify-content:center;
  opacity:0;transition:opacity .14s,background .14s;
}
.sb-item:hover .sb-more,.sb-item.active .sb-more{opacity:1}
.sb-more:hover{background:rgba(0,0,0,.07);color:var(--tx)}
.sb-empty{padding:26px 12px;text-align:center;font-size:12.5px;color:var(--tx-3);line-height:1.8}
.sb-foot{
  border-top:1px solid var(--line);padding:10px 12px;display:flex;align-items:center;gap:9px;
}
.sb-ava{
  width:28px;height:28px;border-radius:50%;flex:0 0 28px;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#4D6BFE,#8B5CF6);color:#fff;font-size:12px;font-weight:600;
}
.foot-name{font-size:13px;color:var(--tx);line-height:1.35;display:flex;align-items:center;gap:6px}
.foot-sub{font-size:11px;color:var(--tx-3);font-variant-numeric:tabular-nums}
.foot-dot{width:6px;height:6px;border-radius:50%;background:#22C55E;box-shadow:0 0 0 2.5px rgba(34,197,94,.16)}
.foot-dot.off{background:#F04438;box-shadow:0 0 0 2.5px rgba(240,68,56,.16)}

/* ================= 主区域 ================= */
#main{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--bg);position:relative}
#topbar{
  height:56px;flex:0 0 56px;display:flex;align-items:center;gap:8px;padding:0 12px 0 10px;
  border-bottom:1px solid transparent;transition:border-color .2s;
}
#topbar.scrolled{border-bottom-color:var(--line)}
.tb-icon{
  width:34px;height:34px;border:none;background:transparent;border-radius:9px;color:var(--tx-2);
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  transition:background .14s,color .14s;
}
.tb-icon:hover{background:#F2F4F7;color:var(--tx)}
.tb-icon svg{width:19px;height:19px}
.tb-title{
  font-size:14px;font-weight:550;color:var(--tx);margin-left:2px;
  max-width:46vw;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;
}
.tb-spacer{flex:1}
.status-pill{
  display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 10px 0 8px;
  border-radius:9px;background:#F7F8FA;border:1px solid var(--line);
  font-size:12.5px;color:var(--tx-2);white-space:nowrap;
  cursor:pointer;font-family:inherit;transition:background .15s,border-color .15s;
}
.status-pill:hover{background:#F1F3F7;border-color:var(--line-2)}
.status-pill .ring{width:16px;height:16px;flex:0 0 16px;transform:rotate(-90deg)}
.status-pill .ring circle{fill:none;stroke-width:2.8;stroke-linecap:round}
.status-pill .ring .bg{stroke:#E1E5EE}
.status-pill .ring .fg{stroke:var(--blue);transition:stroke-dashoffset .45s ease,stroke .3s}
.status-pill .pctx{font-size:11.5px;color:var(--tx-3);font-variant-numeric:tabular-nums}
.status-pill.off .ring .fg{stroke:#F04438}

/* ===== 上下文用量面板 ===== */
#usagePanel{
  position:absolute;top:52px;right:14px;z-index:150;width:386px;
  background:#fff;border:1px solid #ECEEF3;border-radius:16px;
  box-shadow:0 14px 44px rgba(16,24,40,.15),0 2px 8px rgba(16,24,40,.05);
  padding:16px 20px 20px;display:none;transform-origin:top right;
}
#usagePanel.show{display:block;animation:upIn .17s cubic-bezier(.22,.8,.28,1) both}
@keyframes upIn{from{opacity:0;transform:translateY(-6px) scale(.98)}to{opacity:1;transform:none}}
.up-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.up-title{font-size:15px;font-weight:600;color:#20262F}
.up-close{
  width:26px;height:26px;border:none;background:transparent;border-radius:7px;color:#8A93A3;
  cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.14s;
}
.up-close:hover{background:#F2F4F7;color:#333C4C}
.up-close svg{width:15px;height:15px}
.up-num{display:flex;align-items:baseline;gap:9px;margin-bottom:13px}
.up-pct{
  font-size:29px;font-weight:700;letter-spacing:-.6px;color:#12161D;
  font-variant-numeric:tabular-nums;line-height:1.1;
}
.up-sub{font-size:13px;color:#8E96A5}
.up-sub b{font-weight:600;color:#5F6878}
.up-bar{display:flex;height:10px;border-radius:6px;background:#EFF0F3;overflow:hidden;margin-bottom:16px}
.up-bar i{height:100%;transition:width .35s ease}
.up-legend{margin:0 -2px}
.up-row{display:flex;align-items:center;gap:9px;height:31px;font-size:13.5px;color:#2B3342}
.up-row .dot{width:9px;height:9px;border-radius:50%;flex:0 0 9px}
.up-row .nm{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.up-row .vl{color:#9BA3B2;font-size:13px;font-variant-numeric:tabular-nums}
.up-divider{height:1px;background:#EDEFF3;margin:13px 0 15px}
.up-foot{text-align:center;font-size:15px;font-weight:600;color:#1F2329;margin-bottom:12px}
.up-range{position:relative;padding:0 1px}
.up-range input{
  -webkit-appearance:none;appearance:none;display:block;width:100%;height:14px;
  background:transparent;margin:0;cursor:pointer;outline:none;position:relative;z-index:2;
}
.up-range input::-webkit-slider-runnable-track{height:14px;border-radius:7px;background:#EFEFF2}
.up-range input::-webkit-slider-thumb{
  -webkit-appearance:none;width:30px;height:30px;border-radius:50%;background:#fff;
  border:1px solid #EDEFF3;box-shadow:0 2px 7px rgba(16,24,40,.18);margin-top:-8px;
  transition:box-shadow .16s;
}
.up-range input:hover::-webkit-slider-thumb{box-shadow:0 3px 11px rgba(16,24,40,.24)}
.up-range input::-moz-range-track{height:14px;border-radius:7px;background:#EFEFF2}
.up-range input::-moz-range-thumb{
  width:28px;height:28px;border-radius:50%;background:#fff;border:1px solid #EDEFF3;
  box-shadow:0 2px 7px rgba(16,24,40,.18);
}
.up-ticks{position:absolute;left:0;right:0;top:0;height:14px;pointer-events:none;z-index:1}
.up-ticks i{position:absolute;top:5px;width:4px;height:4px;border-radius:50%;background:#D9DCE3;margin-left:-2px}
/* 速度三格 */
.up-sec{display:flex;align-items:center;justify-content:space-between;margin:0 0 9px}
.up-sec .st{font-size:12px;color:#8E97A6;font-weight:500}
.up-sec .tag{
  font-size:10.5px;color:#5B6EA8;background:#F1F4FD;border:1px solid #E7ECF9;
  padding:1px 7px;border-radius:6px;font-variant-numeric:tabular-nums;
}
.up-speed{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sp-cell{background:#F8F9FC;border:1px solid #F0F2F7;border-radius:11px;padding:9px 10px 10px}
.sp-cell .k{font-size:11px;color:#98A1B0;line-height:1.3;margin-bottom:4px;white-space:nowrap}
.sp-cell .v{
  font-size:16px;font-weight:650;color:#1B2029;letter-spacing:-.3px;line-height:1.2;
  font-variant-numeric:tabular-nums;white-space:nowrap;
}
.sp-cell .v em{font-style:normal;font-size:10.5px;font-weight:500;color:#9BA3B2;margin-left:2px;letter-spacing:0}
.sp-cell.hl{background:linear-gradient(135deg,#F3F6FF,#F9FAFF);border-color:#E6ECFF}
.sp-cell.hl .v{color:var(--blue)}

/* 滚动区 */
#body{flex:1;min-height:0;display:flex;flex-direction:column}
#scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain}
#chat{
  width:100%;max-width:760px;margin:0 auto;padding:16px 24px 30px;
  display:flex;flex-direction:column;gap:26px;
}
#main.empty #scroll{flex:0 0 auto;overflow:visible}
#main.empty #body{justify-content:center;padding-bottom:3vh}
#main.empty #chat{display:none}
#main.empty #jumpBtn{display:none}

/* 欢迎区 */
#welcome{display:none;padding:0 24px 22px;flex-direction:column;align-items:center;text-align:center}
#main.empty #welcome{display:flex}
.w-logo{
  width:56px;height:56px;border-radius:17px;background:linear-gradient(135deg,#4D6BFE,#8B5CF6);
  display:flex;align-items:center;justify-content:center;margin-bottom:20px;
  box-shadow:0 10px 28px rgba(77,107,254,.26);
}
.w-logo svg{width:32px;height:32px}
.w-title{
  font-size:26px;font-weight:600;letter-spacing:.2px;margin:0 0 9px;color:var(--tx);
}
.w-sub{font-size:14px;color:var(--tx-3);margin:0;line-height:1.6}
.w-badges{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap;justify-content:center}
.w-badge{
  font-size:12px;color:var(--tx-2);background:#F7F8FA;border:1px solid var(--line);
  padding:4px 10px;border-radius:20px;
}

/* 消息 */
.msg{animation:msgIn .28s cubic-bezier(.22,.8,.28,1) both}
.msg.no-anim{animation:none}
@keyframes msgIn{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
.msg.user{display:flex;justify-content:flex-end}
.msg.user .bubble{
  max-width:min(80%,600px);background:var(--bubble);color:var(--tx);
  border-radius:16px 16px 5px 16px;padding:11px 15px;font-size:15px;line-height:1.7;
  white-space:pre-wrap;word-break:break-word;
}
.msg.user .imgs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.msg.user .imgs img{
  width:110px;height:110px;object-fit:cover;border-radius:10px;cursor:zoom-in;
  border:1px solid rgba(0,0,0,.05);transition:transform .18s;
}
.msg.user .imgs img:hover{transform:scale(1.02)}
.msg.ai{display:block}
.msg.ai .md{font-size:15px;line-height:1.78;color:var(--tx);word-break:break-word}

/* 消息底部：速度徽标 + 操作 */
.mfoot{display:flex;align-items:center;gap:9px;margin-top:8px;min-height:26px;flex-wrap:wrap;row-gap:5px}
.mfoot .acts{margin:0}
.spd{
  display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:8px;
  background:linear-gradient(135deg,#F2F5FF,#F8FAFF);border:1px solid #E3EAFF;
  color:#4D6BFE;font-size:11.5px;font-variant-numeric:tabular-nums;white-space:nowrap;
  transition:background .16s,border-color .16s;user-select:none;
}
.spd svg{width:12px;height:12px;flex:0 0 12px;opacity:.92}
.spd b{font-weight:650;letter-spacing:-.1px}
.spd .u{color:#94A2CE;font-size:10.5px;margin-left:-2px}
.spd .sep{width:1px;height:10px;background:#DDE4F8;margin:0 2px}
.spd .alt{color:#7E8DBB}
.spd-meta{font-size:11.5px;color:#A8AFBB;font-variant-numeric:tabular-nums;white-space:nowrap}
.msg.ai:hover .spd{border-color:#D3DDFF;background:linear-gradient(135deg,#EDF2FF,#F5F8FF)}
.spd.live{background:#F7F8FA;border-color:var(--line);color:var(--tx-2)}
.spd.live:hover{background:#F7F8FA;border-color:var(--line)}
.spd.live b{color:var(--blue)}
.spd.live .pulse{width:6px;height:6px;border-radius:50%;background:var(--blue);animation:beat 1.05s ease-in-out infinite}
.spd.live .sep{background:#E3E6EC}
@keyframes beat{0%,100%{opacity:.3;transform:scale(.78)}50%{opacity:1;transform:scale(1)}}

.acts{display:flex;align-items:center;gap:2px;height:26px;opacity:0;transition:opacity .16s}
.msg.ai:hover .acts,.msg.ai.show-acts .acts{opacity:1}
.act{
  display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 7px;border:none;
  background:transparent;border-radius:7px;color:var(--tx-3);font-size:12.5px;cursor:pointer;
  transition:background .14s,color .14s;
}
.act:hover{background:#F2F4F7;color:var(--tx-2)}
.act svg{width:14px;height:14px}
.msg.ai.streaming .acts{display:none}

/* Markdown */
.md p{margin:0 0 13px}
.md > *:last-child{margin-bottom:0}
.md h1,.md h2,.md h3,.md h4,.md h5,.md h6{margin:22px 0 11px;line-height:1.45;font-weight:600;color:var(--tx)}
.md h1{font-size:21px}.md h2{font-size:19px}.md h3{font-size:16.5px}
.md h4,.md h5,.md h6{font-size:15px}
.md > h1:first-child,.md > h2:first-child,.md > h3:first-child{margin-top:0}
.md ul,.md ol{margin:0 0 13px;padding-left:23px}
.md li{margin:5px 0}
.md li > ul,.md li > ol{margin:5px 0 0}
.md blockquote{
  margin:0 0 13px;padding:3px 0 3px 13px;border-left:3px solid #DCE1EA;color:var(--tx-2);
}
.md hr{border:none;border-top:1px solid var(--line);margin:18px 0}
.md a{color:var(--blue);text-decoration:none;border-bottom:1px solid rgba(77,107,254,.3)}
.md a:hover{border-bottom-color:var(--blue)}
.md strong{font-weight:700}
.md code{
  font-family:var(--mono);font-size:13px;background:#F1F3F7;
  padding:1.5px 5px;border-radius:5px;color:#22303F;white-space:break-spaces;
}
.md .code{margin:0 0 14px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#FBFCFD}
.md .code-head{
  display:flex;align-items:center;justify-content:space-between;padding:6px 8px 6px 13px;
  background:#F5F7FA;border-bottom:1px solid var(--line);
}
.md .code-lang{font-family:var(--mono);font-size:11.5px;color:var(--tx-3);letter-spacing:.3px;text-transform:lowercase}
.md .code-copy{
  border:none;background:transparent;color:var(--tx-3);font-size:12px;cursor:pointer;
  padding:3px 9px;border-radius:6px;transition:.14s;
}
.md .code-copy:hover{background:#E9EDF3;color:var(--tx)}
.md pre{margin:0;padding:14px 16px;overflow-x:auto;line-height:1.62}
.md pre code{background:none;border:none;padding:0;color:#24292F;font-size:13px;white-space:pre}
.md .tbl{overflow-x:auto;margin:0 0 14px}
.md table{border-collapse:collapse;width:100%;font-size:14px}
.md th,.md td{border:1px solid var(--line-2);padding:8px 12px;text-align:left;white-space:nowrap}
.md th{background:#F7F9FC;font-weight:600}
.caret{
  display:inline-block;width:7px;height:15px;background:var(--blue);border-radius:2px;
  vertical-align:-2px;margin-left:3px;animation:blink 1s steps(1) infinite;
}
@keyframes blink{50%{opacity:0}}

/* 跳到底部 */
#jumpBtn{
  position:absolute;left:50%;transform:translateX(-50%);bottom:100%;margin-bottom:4px;z-index:12;
  width:32px;height:32px;border-radius:50%;border:1px solid var(--line-2);background:#fff;
  color:var(--tx-2);cursor:pointer;display:none;align-items:center;justify-content:center;
  box-shadow:var(--shadow);transition:.16s;
}
#jumpBtn.show{display:flex}
#jumpBtn:hover{color:var(--blue);border-color:#CFD9FF}

/* ================= 输入区 ================= */
#composerArea{position:relative;flex:0 0 auto;padding:6px 24px 14px;background:var(--bg)}
#composerArea::before{
  content:"";position:absolute;left:0;right:0;top:-26px;height:26px;pointer-events:none;
  background:linear-gradient(to top,rgba(255,255,255,.95),rgba(255,255,255,0));
}
#composerWrap{max-width:760px;margin:0 auto;width:100%}
#attachments{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
#attachments:empty{display:none}
.att{
  position:relative;width:64px;height:64px;border-radius:11px;overflow:hidden;
  border:1px solid var(--line-2);background:#F7F8FA;
  animation:msgIn .2s ease both;
}
.att img{width:100%;height:100%;object-fit:cover;cursor:zoom-in}
.att .rm{
  position:absolute;top:3px;right:3px;width:18px;height:18px;border-radius:50%;border:none;
  background:rgba(20,24,32,.62);color:#fff;font-size:12px;line-height:1;cursor:pointer;
  display:flex;align-items:center;justify-content:center;backdrop-filter:blur(3px);
  opacity:0;transition:opacity .15s;
}
.att:hover .rm{opacity:1}
@media (hover:none){.att .rm{opacity:1}}   /* 触屏没有 hover，删除按钮常显 */
.att.loading::after{
  content:'';position:absolute;inset:0;background:
    linear-gradient(100deg,rgba(255,255,255,0) 20%,rgba(255,255,255,.85) 50%,rgba(255,255,255,0) 80%) 0 0/220% 100% no-repeat,
    #EEF1F6;
  animation:attShine 1.1s linear infinite;
}
.att.loading .rm{opacity:1}
@keyframes attShine{0%{background-position:120% 0,0 0}100%{background-position:-120% 0,0 0}}
.img-note{font-size:12.5px;color:var(--tx-3);margin-bottom:4px}
#box{
  border:1px solid var(--line-2);border-radius:22px;background:#fff;
  padding:9px 9px 9px 13px;transition:border-color .18s,box-shadow .18s;
  box-shadow:0 2px 10px rgba(16,24,40,.04);
}
#box.drag{border-color:var(--blue);background:var(--blue-soft-2)}
#box:focus-within{border-color:#BFCCFF;box-shadow:0 0 0 3.5px rgba(77,107,254,.10),0 2px 10px rgba(16,24,40,.05)}
#text{
  display:block;width:100%;border:none;outline:none;resize:none;background:transparent;
  font-family:inherit;font-size:15px;line-height:1.6;color:var(--tx);
  padding:7px 7px 5px;max-height:180px;min-height:32px;
}
#text::placeholder{color:#ADB4C0}
.tool-row{display:flex;align-items:flex-end;gap:2px}
.tools{display:flex;align-items:center;gap:2px;flex:1}
.tool{
  width:32px;height:32px;border:none;background:transparent;border-radius:9px;color:#8A93A3;
  display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.15s;
}
.tool:hover{background:#F2F4F7;color:var(--blue)}
.tool svg{width:19px;height:19px}
/* 联网搜索开关：平时是一条灰底胶囊，开启后变蓝底 */
.tool.web{
  width:auto;height:30px;padding:0 11px 0 8px;gap:6px;border-radius:15px;
  border:1px solid var(--line-2);background:#fff;font-size:12.5px;color:var(--tx-2);
  transition:background .16s,color .16s,border-color .16s,box-shadow .16s;
}
.tool.web svg{width:15px;height:15px}
.tool.web span{white-space:nowrap;line-height:1}
.tool.web:hover{background:#F5F7FF;color:var(--blue);border-color:#D6DEFB}
.tool.web.on{
  background:rgba(77,107,254,.09);border-color:rgba(77,107,254,.32);color:var(--blue);
  box-shadow:0 0 0 3px rgba(77,107,254,.07);
}
.tool.web.on svg{animation:none}
/* 联网搜索结果卡片 */
.sres{
  border:1px solid var(--line-2);background:#FBFCFE;border-radius:13px;
  padding:10px 13px;margin:0 0 14px;max-width:100%;
}
.sres.pending{display:flex;align-items:center;gap:8px;color:var(--tx-3);font-size:13px}
.sres.pending .spin{
  width:13px;height:13px;border-radius:50%;border:2px solid #D7DDEA;border-top-color:var(--blue);
  animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.sres-head{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--tx-2);margin-bottom:8px}
.sres-head b{font-weight:600;color:var(--tx)}
.sres-head svg{width:14px;height:14px;color:var(--blue);flex:0 0 14px}
.seng{
  padding:1px 7px;border-radius:6px;background:rgba(77,107,254,.1);
  color:var(--blue);font-size:11px;line-height:1.6;
}
.sms{color:var(--tx-3);font-size:11.5px;margin-left:auto}
.slist{display:flex;flex-direction:column;gap:5px}
.sitem{
  display:flex;align-items:flex-start;gap:7px;color:var(--tx-2);text-decoration:none;
  font-size:12.8px;line-height:1.5;border-radius:6px;padding:1px 0;
}
.sitem i{
  flex:0 0 16px;height:16px;margin-top:2px;border-radius:5px;background:#EDF0F7;color:#8A93A3;
  font-size:10.5px;font-style:normal;display:flex;align-items:center;justify-content:center;
}
.sitem span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sitem:hover span{color:var(--blue);text-decoration:underline}
.sres-err{font-size:12.5px;color:var(--tx-3)}
.tool.rec{background:#FDECEC;color:#F04438;animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(240,68,56,.35)}50%{box-shadow:0 0 0 7px rgba(240,68,56,0)}}
#send{
  width:34px;height:34px;flex:0 0 34px;border:none;border-radius:50%;background:var(--blue);
  color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;
  transition:background .16s,transform .12s;margin-bottom:1px;
}
#send:hover{background:var(--blue-h)}
#send:active{transform:scale(.94)}
#send svg{width:18px;height:18px}
#send:disabled{background:#E9ECF2;color:#B4BBC7;cursor:default}
#send.stop{background:#F04438}
#send.stop:hover{background:#DC3A2E}

/* 建议卡片 */
#suggest{display:none;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px}
#main.empty #suggest{display:flex}
.chip{
  display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:20px;
  border:1px solid var(--line-2);background:#fff;color:var(--tx-2);font-size:13px;
  cursor:pointer;transition:.16s;box-shadow:var(--shadow-sm);white-space:nowrap;
}
.chip:hover{border-color:#C9D5FF;background:var(--blue-soft-2);color:var(--blue);transform:translateY(-1px)}
.chip svg{width:15px;height:15px;opacity:.85}
.disclaimer{
  text-align:center;font-size:11.5px;color:#B3B9C6;margin-top:11px;line-height:1.6;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}

/* 拖拽遮罩 */
#dropMask{
  position:fixed;inset:0;z-index:200;display:none;align-items:center;justify-content:center;
  background:rgba(246,248,255,.82);backdrop-filter:blur(6px);
}
#dropMask.show{display:flex}
.drop-card{
  border:2px dashed #A9BAFF;border-radius:20px;padding:34px 52px;background:#fff;
  color:var(--blue);font-size:15px;font-weight:550;box-shadow:var(--shadow-lg);
  display:flex;flex-direction:column;align-items:center;gap:10px;
}
.drop-card svg{width:34px;height:34px}

/* 弹层/菜单/提示 */
.menu{
  position:fixed;z-index:300;min-width:132px;background:#fff;border:1px solid var(--line);
  border-radius:11px;padding:5px;box-shadow:var(--shadow-lg);animation:pop .14s ease both;
}
@keyframes pop{from{opacity:0;transform:scale(.96) translateY(-3px)}to{opacity:1;transform:none}}
.menu button{
  display:block;width:100%;text-align:left;border:none;background:transparent;border-radius:7px;
  padding:7px 10px;font-size:13px;color:var(--tx-2);cursor:pointer;transition:.12s;
}
.menu button:hover{background:#F3F5F8;color:var(--tx)}
.menu button.danger{color:#E5484D}
.menu button.danger:hover{background:#FDEDED;color:#D93A3F}

#modal{position:fixed;inset:0;z-index:320;display:none;align-items:center;justify-content:center;background:rgba(24,28,38,.34);backdrop-filter:blur(2px)}
#modal.show{display:flex}
.modal-card{
  width:min(360px,88vw);background:#fff;border-radius:16px;padding:20px;box-shadow:var(--shadow-lg);
  animation:pop .16s ease both;
}
.modal-card h3{margin:0 0 8px;font-size:16px;font-weight:600}
.modal-card p{margin:0 0 18px;font-size:13.5px;color:var(--tx-2);line-height:1.65}
.modal-btns{display:flex;gap:8px;justify-content:flex-end}
.modal-btns button{
  height:34px;padding:0 15px;border-radius:9px;font-size:13.5px;cursor:pointer;border:1px solid transparent;
  transition:.14s;
}
.btn-ghost{background:#fff;border-color:var(--line-2);color:var(--tx-2)}
.btn-ghost:hover{background:#F5F6F8}
.btn-danger{background:#E5484D;color:#fff}
.btn-danger:hover{background:#D93A3F}

#toastbox{position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:400;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{
  background:rgba(30,35,45,.92);color:#fff;font-size:13px;padding:9px 16px;border-radius:10px;
  box-shadow:var(--shadow-lg);animation:tin .22s ease both;backdrop-filter:blur(6px);
}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}

#lightbox{position:fixed;inset:0;z-index:350;display:none;align-items:center;justify-content:center;background:rgba(15,18,24,.86);padding:32px}
#lightbox.show{display:flex}
#lightbox img{max-width:100%;max-height:100%;border-radius:10px;box-shadow:0 20px 60px rgba(0,0,0,.5)}

#backdrop{display:none;position:fixed;inset:0;background:rgba(20,24,32,.35);z-index:35}

/* ================= 响应式：平板 / 手机 ================= */
@media (max-width:860px){
  /* 侧边栏 → 抽屉 */
  #sidebar{
    position:fixed;top:0;bottom:0;left:0;z-index:60;width:min(300px,84vw);flex-basis:min(300px,84vw);
    transform:translateX(-100%);transition:transform .3s cubic-bezier(.22,.8,.28,1);
    box-shadow:none;padding-top:env(safe-area-inset-top);
  }
  #sidebar.open{transform:none;box-shadow:0 0 60px rgba(16,24,40,.24)}
  #sbInner{width:100%}
  body.sb-collapsed #sidebar{flex-basis:min(300px,84vw);opacity:1;pointer-events:auto}
  #backdrop{z-index:55}
  #backdrop.show{display:block}

  /* 顶栏 */
  #topbar{
    position:relative;height:calc(52px + env(safe-area-inset-top));flex:0 0 auto;
    padding:env(safe-area-inset-top) 6px 0 4px;gap:4px;
    background:rgba(255,255,255,.86);backdrop-filter:saturate(180%) blur(12px);
  }
  #topbar.scrolled{background:rgba(255,255,255,.94)}
  .tb-icon{width:38px;height:38px;border-radius:10px}
  .tb-icon svg{width:20px;height:20px}
  .tb-title{
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    margin:0;max-width:54vw;font-size:14px;text-align:center;pointer-events:none;
  }
  .status-pill{height:32px;padding:0 9px;gap:6px;border-radius:10px}
  .status-pill .pctx{font-size:11px}
  .status-pill span.mname{display:none}

  /* 消息区 */
  #chat{padding:10px 15px 26px;gap:20px}
  #scroll{overscroll-behavior-y:contain;-webkit-overflow-scrolling:touch}
  #scroll::-webkit-scrollbar{width:0;height:0}
  .msg.user .bubble{max-width:86%;font-size:15px;border-radius:15px 15px 5px 15px}
  .msg.user .imgs img{width:92px;height:92px}
  .msg.ai .md{font-size:15px;line-height:1.76}
  .mfoot{gap:8px;margin-top:6px}
  .spd{height:25px;font-size:11.5px}

  /* 欢迎区 */
  #welcome{padding:0 20px 16px}
  .w-logo{width:48px;height:48px;border-radius:15px;margin-bottom:16px}
  .w-logo svg{width:28px;height:28px}
  .w-title{font-size:21px;margin-bottom:7px}
  .w-sub{font-size:13px;line-height:1.6}
  .w-badges{gap:6px;margin-top:13px}
  .w-badge{font-size:11.5px;padding:3px 9px}

  /* 输入区 */
  #composerArea{padding:6px 12px calc(10px + env(safe-area-inset-bottom))}
  #composerArea::before{top:-18px;height:18px}
  #box{border-radius:20px;padding:7px 7px 7px 11px}
  #text{font-size:16px;line-height:1.55;padding:7px 6px 4px;max-height:34vh}
  .tool{width:38px;height:38px;border-radius:10px}
  .tool svg{width:20px;height:20px}
  #send{width:38px;height:38px;flex:0 0 38px}
  .tool,.send,#send,.chip,.act,.sb-item,.sb-more{touch-action:manipulation}

  /* 建议：单行横滑，更接近 App */
  #suggest{
    flex-wrap:nowrap;justify-content:flex-start;overflow-x:auto;overflow-y:hidden;
    gap:7px;margin-top:12px;padding:2px 1px 4px;
    scrollbar-width:none;-ms-overflow-style:none;-webkit-overflow-scrolling:touch;
  }
  #suggest::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;font-size:12.5px;padding:8px 13px}
  .disclaimer{font-size:10.5px;margin-top:9px;white-space:normal;padding:0 4px}

  /* 上下文用量 → 底部抽屉 */
  #usagePanel{
    position:fixed;left:0;right:0;bottom:0;top:auto;width:auto;max-width:520px;margin:0 auto;
    max-height:84vh;overflow-y:auto;
    border-radius:22px 22px 0 0;border-bottom:none;
    padding:10px 20px calc(18px + env(safe-area-inset-bottom));
    box-shadow:0 -10px 44px rgba(16,24,40,.2),0 0 0 100vmax rgba(18,22,30,.32);
    transform-origin:bottom center;
  }
  #usagePanel.show{animation:sheetIn .26s cubic-bezier(.22,.8,.28,1) both}
  @keyframes sheetIn{from{opacity:.5;transform:translateY(26px)}to{opacity:1;transform:none}}
  #usagePanel::before{
    content:"";display:block;width:38px;height:4px;border-radius:3px;
    background:#E1E5EC;margin:0 auto 14px;
  }
  .up-pct{font-size:26px}
  .up-speed{gap:7px}
  .sp-cell{padding:8px 9px 9px}
  .sp-cell .v{font-size:15px}
  .up-range input{height:22px}
  .up-range input::-webkit-slider-runnable-track{height:14px}
  .up-range input::-webkit-slider-thumb{width:32px;height:32px;margin-top:-9px}
  .up-ticks{height:22px;top:4px}

  #jumpBtn{bottom:2px;width:34px;height:34px}
  #lightbox{padding:16px}
  #toastbox{top:calc(10px + env(safe-area-inset-top))}
  .att{width:58px;height:58px}
}

/* 小屏手机 */
@media (max-width:560px){
  #chat{padding:8px 12px 24px;gap:18px}
  #composerArea{padding:4px 8px calc(8px + env(safe-area-inset-bottom))}
  .tb-title{max-width:48vw;font-size:13.5px}
  #suggest .chip{font-size:12px;padding:7px 12px}
  .w-title{font-size:19px}
  .w-sub{font-size:12.5px}
  .msg.user .bubble{max-width:90%}
  .spd{padding:0 8px;font-size:11px}
  .spd .u{font-size:10px}
  .spd-meta{font-size:11px}
  .up-speed{grid-template-columns:repeat(3,1fr);gap:6px}
  .sp-cell{padding:7px 8px 8px}
  .sp-cell .k{font-size:10.5px}
  .sp-cell .v{font-size:14px}
  .sp-cell .v em{font-size:9.5px;margin-left:1px}
  .up-row{font-size:13px;height:29px}
}

/* 横屏矮屏：收起欢迎语的留白 */
@media (max-height:520px){
  .w-logo{margin-bottom:10px;width:40px;height:40px;border-radius:13px}
  .w-logo svg{width:24px;height:24px}
  .w-title{font-size:18px;margin-bottom:4px}
  .w-badges{display:none}
  #main.empty #body{padding-bottom:0}
}
@media (hover:none){.acts{opacity:1}.msg.ai .acts{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<script>
(function(){
"use strict";

/* ============ 基础工具 ============ */
var $ = function(s){ return document.querySelector(s); };
var chatEl=$('#chat'), scrollEl=$('#scroll'), ta=$('#text'), sendBtn=$('#send'),
    attEl=$('#attachments'), sbList=$('#sbList'), mainEl=$('#main'),
    tbTitle=$('#tbTitle'), autoScroll=true, composing=false;
var usageBtn=$('#usageBtn'), usagePanel=$('#usagePanel'), ringFg=$('#ringFg');

var CH = {amp:'&amp;',lt:'&lt;',gt:'&gt;',quot:'&quot;'};
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){ return CH[c==='&'?'amp':c==='<'?'lt':c==='>'?'gt':'quot']; }); }
function uid(){ return 's'+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function pad(n){ return n<10?'0'+n:''+n; }

/* ============ Markdown 渲染 ============ */
function inlineMd(s){
  var t = esc(s);
  t = t.replace(/`([^`\n]+)`/g, function(m,c){ return '<code>'+c+'</code>'; });
  t = t.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');
  t = t.replace(/__([^_\n]+)__/g, '<strong>$1</strong>');
  t = t.replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g, '$1<em>$2</em>');
  t = t.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
  t = t.replace(/\[([^\]\n]*)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noreferrer noopener">$1</a>');
  return t;
}
var codeSeq = 0;
function codeHtml(code, lang){
  var id = 'code_'+(++codeSeq);
  var name = (lang||'text').replace(/[^a-zA-Z0-9+#.-]/g,'') || 'text';
  return '<div class="code"><div class="code-head"><span class="code-lang">'+esc(name)+
    '</span><button class="code-copy" data-copy="'+id+'">复制</button></div>'+
    '<pre><code id="'+id+'">'+esc(code)+'</code></pre></div>';
}
function splitRow(line){
  return line.trim().replace(/^\|/,'').replace(/\|$/,'').split('|').map(function(c){ return c.trim(); });
}
function md(src){
  var lines = String(src||'').replace(/\r\n?/g,'\n').split('\n');
  var out=[], i=0, line, m;
  function isFence(l){ return /^\s*(```|~~~)/.test(l); }
  function isList(l){ return /^\s*([-*+]|\d+[.)])\s+/.test(l); }
  function isHead(l){ return /^#{1,6}\s+/.test(l); }
  function isQuote(l){ return /^\s*>\s?/.test(l); }
  while(i < lines.length){
    line = lines[i];
    if(isFence(line)){
      var fence = line.trim().slice(0,3);
      var lang = line.trim().slice(3).trim();
      var buf=[]; i++;
      while(i<lines.length && lines[i].trim().indexOf(fence)!==0){ buf.push(lines[i]); i++; }
      i++;
      out.push(codeHtml(buf.join('\n'), lang));
      continue;
    }
    if(!line.trim()){ i++; continue; }
    m = line.match(/^(#{1,6})\s+(.*)$/);
    if(m){ var lv=m[1].length; out.push('<h'+lv+'>'+inlineMd(m[2])+'</h'+lv+'>'); i++; continue; }
    if(/^\s*([-*_])\s*(\1\s*){2,}$/.test(line)){ out.push('<hr>'); i++; continue; }
    if(isQuote(line)){
      var qb=[];
      while(i<lines.length && isQuote(lines[i])){ qb.push(lines[i].replace(/^\s*>\s?/,'')); i++; }
      out.push('<blockquote>'+md(qb.join('\n'))+'</blockquote>');
      continue;
    }
    if(line.indexOf('|')>=0 && i+1<lines.length && /^\s*\|?[\s:\-|]+\|?\s*$/.test(lines[i+1]) && lines[i+1].indexOf('-')>=0){
      var head = splitRow(line); i += 2;
      var rows=[];
      while(i<lines.length && lines[i].trim() && lines[i].indexOf('|')>=0){ rows.push(splitRow(lines[i])); i++; }
      var th = '<tr>'+head.map(function(c){ return '<th>'+inlineMd(c)+'</th>'; }).join('')+'</tr>';
      var tb = rows.map(function(r){
        var cells=[];
        for(var k=0;k<head.length;k++){ cells.push('<td>'+inlineMd(r[k]===undefined?'':r[k])+'</td>'); }
        return '<tr>'+cells.join('')+'</tr>';
      }).join('');
      out.push('<div class="tbl"><table><thead>'+th+'</thead><tbody>'+tb+'</tbody></table></div>');
      continue;
    }
    if(isList(line)){
      var ordered = /^\s*\d+[.)]\s+/.test(line);
      var items=[];
      while(i<lines.length && isList(lines[i])){
        items.push(lines[i].replace(/^\s*([-*+]|\d+[.)])\s+/,'')); i++;
      }
      out.push((ordered?'<ol>':'<ul>')+items.map(function(t){ return '<li>'+inlineMd(t)+'</li>'; }).join('')+(ordered?'</ol>':'</ul>'));
      continue;
    }
    var pb=[];
    while(i<lines.length && lines[i].trim() && !isFence(lines[i]) && !isList(lines[i]) && !isHead(lines[i]) && !isQuote(lines[i])){
      if(lines[i].indexOf('|')>=0 && i+1<lines.length && /^\s*\|?[\s:\-|]+\|?\s*$/.test(lines[i+1]) && lines[i+1].indexOf('-')>=0){ break; }
      pb.push(lines[i]); i++;
    }
    if(pb.length){ out.push('<p>'+inlineMd(pb.join('\n')).replace(/\n/g,'<br>')+'</p>'); }
    else { i++; }
  }
  return out.join('');
}

/* ============ 会话存储 ============ */
var LS_S='qvl_sessions_v2', LS_O='qvl_order_v2', LS_C='qvl_sb_collapsed';
var sessions={}, order=[], curId=null;

function _trySave(){
  try{
    localStorage.setItem(LS_S, JSON.stringify(sessions));
    localStorage.setItem(LS_O, JSON.stringify(order));
    return true;
  }catch(e){ return false; }
}
function save(){
  if(_trySave()) return true;
  /* 超出浏览器存储配额（图片很占地方，通常 5MB 上限）：
     从最旧的会话开始丢弃图片数据，先保住文字，避免整段对话静默丢失 */
  var ids=order.slice().sort(function(a,b){
    return ((sessions[a]||{}).ts||0) - ((sessions[b]||{}).ts||0);
  });
  for(var k=0;k<ids.length;k++){
    var ss=sessions[ids[k]];
    if(!ss || !ss.messages) continue;
    var hit=false;
    for(var j=0;j<ss.messages.length;j++){
      var mm=ss.messages[j];
      if(mm && mm.imgs && mm.imgs.length){ mm.imgs=[]; mm.imgsDropped=true; hit=true; }
    }
    if(hit && _trySave()) return true;
  }
  /* 还是存不下：把非当前会话的老对话裁到最近 2 条 */
  for(var k2=0;k2<ids.length && ids.length>1;k2++){
    if(ids[k2]===curId) continue;
    var s2=sessions[ids[k2]];
    if(!s2 || !s2.messages || s2.messages.length<=2) continue;
    s2.messages=s2.messages.slice(-2);
    if(_trySave()) return true;
  }
  return false;
}
function load(){
  try{ sessions = JSON.parse(localStorage.getItem(LS_S)) || {}; }catch(e){ sessions = {}; }
  try{ order = JSON.parse(localStorage.getItem(LS_O)) || []; }catch(e){ order = []; }
  if(!order.length) migrateV1();
}
function migrateV1(){
  try{
    var old = JSON.parse(localStorage.getItem('qvl_sessions') || 'null');
    var oldOr = JSON.parse(localStorage.getItem('qvl_order') || 'null');
    if(!old || !oldOr || !oldOr.length) return;
    oldOr.forEach(function(id, idx){
      var s = old[id]; if(!s) return;
      sessions[id] = {
        title: s.title || '新对话',
        ts: Date.now() - idx*3600*1000,
        messages: (s.messages||[]).map(function(m){
          return { role: m.role, content: m.content||'', imgs: m.img ? [m.img] : (m.imgs||[]) };
        })
      };
      order.push(id);
    });
    save();
  }catch(e){}
}

/* ============ 侧边栏 ============ */
function fmtGroup(ts){
  var now=new Date();
  var today=new Date(now.getFullYear(),now.getMonth(),now.getDate()).getTime();
  if(ts>=today) return '今天';
  if(ts>=today-86400000) return '昨天';
  if(ts>=today-7*86400000) return '最近 7 天';
  return '更早';
}
function renderSidebar(){
  sbList.innerHTML='';
  if(!order.length){
    sbList.innerHTML='<div class="sb-empty">还没有对话记录<br>开始一段新对话吧</div>';
    return;
  }
  var groups={}, gOrder=['今天','昨天','最近 7 天','更早'];
  order.forEach(function(id){
    var s=sessions[id]; if(!s) return;
    var g=fmtGroup(s.ts||0);
    (groups[g]=groups[g]||[]).push(id);
  });
  gOrder.forEach(function(g){
    if(!groups[g] || !groups[g].length) return;
    var h=document.createElement('div');
    h.className='sb-group'; h.textContent=g;
    sbList.appendChild(h);
    groups[g].forEach(function(id){ sbList.appendChild(sbItem(id)); });
  });
}
function sbItem(id){
  var s=sessions[id];
  var d=document.createElement('div');
  d.className='sb-item'+(id===curId?' active':'');
  d.dataset.id=id;
  d.innerHTML='<span class="t">'+esc(s.title||'新对话')+'</span>'+
    '<button class="sb-more" title="更多"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="19" cy="12" r="1.7"/></svg></button>';
  d.addEventListener('click', function(e){
    if(e.target.closest('.sb-more')){ e.stopPropagation(); openItemMenu(e.target.closest('.sb-more'), id); return; }
    openSession(id);
  });
  return d;
}
document.getElementById('newChatBtn').addEventListener('click', newChat);
document.getElementById('topNewBtn').addEventListener('click', newChat);

function newChat(){
  curId=null;
  attEl.innerHTML='';
  attachments=[];
  ta.value='';
  autosize();
  updateSendState();
  renderAll();
  ta.focus();

}
function openSession(id){
  curId=id;
  renderAll();
  if(window.innerWidth<=860) closeSidebar();
}
function renderAll(){
  renderSidebar();
  renderChat();
  syncEmpty();
  updateTitle();
  updateUsagePill();

}

/* ============ 菜单 / 重命名 / 删除 ============ */
var openMenuEl=null;
function closeMenu(){ if(openMenuEl){ openMenuEl.remove(); openMenuEl=null; } }
function openItemMenu(btn, id){
  closeMenu();
  var menu=document.createElement('div');
  menu.className='menu';
  menu.innerHTML='<button data-m="rename">重命名</button><button data-m="del" class="danger">删除</button>';
  document.body.appendChild(menu);
  var r=btn.getBoundingClientRect();
  var top=r.bottom+4;
  if(top+100>window.innerHeight) top=r.top-100;
  menu.style.top=top+'px';
  menu.style.left=Math.max(8, Math.min(r.right-132, window.innerWidth-140))+'px';
  openMenuEl=menu;
  menu.addEventListener('click', function(e){
    var b=e.target.closest('[data-m]'); if(!b) return;
    var act=b.dataset.m;
    closeMenu();
    if(act==='rename') startRename(id);
    else askDelete(id);
  });
}
document.addEventListener('mousedown', function(e){
  if(openMenuEl && !openMenuEl.contains(e.target)) closeMenu();
});
document.addEventListener('keydown', function(e){ if(e.key==='Escape'){ closeMenu(); closeUsage(); } });

function startRename(id){
  var item=sbList.querySelector('.sb-item[data-id="'+id+'"]');
  if(!item) return;
  var span=item.querySelector('.t');
  var inp=document.createElement('input');
  inp.className='rename'; inp.value=sessions[id].title||'';
  span.replaceWith(inp);
  inp.focus(); inp.select();
  var done=false;
  function commit(ok){
    if(done) return; done=true;
    if(ok){ var v=inp.value.trim(); if(v) sessions[id].title=v; save(); }
    renderSidebar();
    if(id===curId) updateTitle();
  }
  inp.addEventListener('keydown', function(e){
    if(e.key==='Enter'){ e.preventDefault(); commit(true); }
    if(e.key==='Escape'){ e.preventDefault(); commit(false); }
  });
  inp.addEventListener('blur', function(){ commit(true); });
  inp.addEventListener('click', function(e){ e.stopPropagation(); });
}

function askDelete(id){
  showModal('删除对话', '「'+(sessions[id]?sessions[id].title:'')+'」将从历史记录中移除，此操作不可撤销。', '删除', function(){
    delete sessions[id];
    order = order.filter(function(x){ return x!==id; });
    if(curId===id){ curId=null; }
    save(); renderAll(); toast('已删除');
  });
}

var modal=$('#modal');
function showModal(title, desc, okText, onOk){
  $('#mdTitle').textContent=title;
  $('#mdDesc').textContent=desc;
  $('#mdOk').textContent=okText;
  modal.classList.add('show');
  var ok=$('#mdOk'), cancel=$('#mdCancel');
  var close=function(){ modal.classList.remove('show'); ok.onclick=null; cancel.onclick=null; };
  ok.onclick=function(){ close(); onOk(); };
  cancel.onclick=close;
  modal.onclick=function(e){ if(e.target===modal) close(); };
}

/* ============ 消息渲染 ============ */
function hasMessages(){
  return !!(curId && sessions[curId] && sessions[curId].messages.length);
}
function syncEmpty(){ mainEl.classList.toggle('empty', !hasMessages()); }
function updateTitle(){
  tbTitle.textContent = (curId && sessions[curId]) ? (sessions[curId].title||'新的对话') : '新的对话';

function scrollBottom(smooth){
  if(smooth && !prefersReduce()){
    scrollEl.scrollTo({top:scrollEl.scrollHeight, behavior:'smooth'});
  }else{
    scrollEl.scrollTop = scrollEl.scrollHeight;
  }
}
function prefersReduce(){
  return window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
}

var ICON_COPY='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2.5"/><path d="M15 5.5A2.5 2.5 0 0 0 12.5 3H6.5A2.5 2.5 0 0 0 4 5.5v6A2.5 2.5 0 0 0 6.5 14"/></svg>';
var ICON_REGEN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 6.1"/><path d="M20 4.5V11h-6.2"/></svg>';
var ICON_BOLT='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M13.2 2.4L5 13.1h5.3l-1.1 8.5 8.4-10.9h-5.4l1-8.3z"/></svg>';
var ICON_GLOBE='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 2.5 15.4 0 18M12 3c-2.5 2.6-2.5 15.4 0 18"/></svg>';

function escAttr(s){
  return String(s==null?'':s).replace(/[&<>"']/g, function(c){
    return c==='&'?'&amp;':c==='<'?'&lt;':c==='>'?'&gt;':c==='"'?'&quot;':'&#39;';
  });
}
function safeUrl(u){
  u=String(u||'');
  return /^https?:\/\//i.test(u) ? u : '';
}
/* info: {query, engine, ms, sources:[{title,url}], error}
   pending=true 时渲染"正在搜索"的占位 */
function searchCardHTML(info, pending){
  if(pending){
    return '<div class="sres pending"><span class="spin"></span>正在联网搜索…</div>';
  }
  info=info||{};
  var ENG_NAME={'360':'360 搜索','百度':'百度','Bing':'Bing','DuckDuckGo':'DuckDuckGo'};
  var src=(info.sources||[]).filter(function(s){ return s && safeUrl(s.url); });
  var head='<div class="sres-head">'+ICON_GLOBE+'<b>已联网搜索</b>'+
    (info.engine? '<span class="seng">'+esc(ENG_NAME[info.engine]||info.engine)+'</span>':'')+
    (info.ms? '<span class="sms">'+(info.ms/1000).toFixed(1)+'s</span>':'')+'</div>';
  var list='';
  if(src.length){
    list='<div class="slist">'+src.slice(0,6).map(function(s,i){
      return '<a class="sitem" href="'+escAttr(safeUrl(s.url))+'" target="_blank" rel="noopener noreferrer"'+
        ' title="'+escAttr(s.title)+'"><i>'+(i+1)+'</i><span>'+esc(s.title||s.url)+'</span></a>';
    }).join('')+'</div>';
  }
  var note='';
  if(info.error){
    note='<div class="sres-err">'+esc(info.error)+'</div>';
  }else if(!src.length){
    note='<div class="sres-err">搜索没有返回可用的网页结果。</div>';
  }
  return '<div class="sres">'+head+list+note+'</div>';
}

/* ---- 速度格式化与徽标 ---- */
function fmtTps(v){
  v=Number(v)||0;
  if(v<=0) return '—';
  if(v>=100) return String(Math.round(v));
  if(v>=10) return String(Math.round(v*10)/10).replace(/\.0$/,'');
  return (Math.round(v*10)/10).toFixed(1);
}
function fmtSec(v){
  v=Number(v)||0;
  if(v<=0) return '—';
  if(v<10) return (Math.round(v*10)/10).toFixed(1)+'s';
  if(v<60) return Math.round(v)+'s';
  return Math.floor(v/60)+'m'+String(Math.round(v%60)).padStart(2,'0')+'s';
}
function tpsOf(u){
  if(!u) return 0;
  if(u.tps>0) return u.tps;
  if(u.eval && u.eval_ns) return u.eval/(u.eval_ns/1e9);
  if(u.eval && u.wall) return u.eval/u.wall;
  return 0;
}
function ttftOf(u){
  if(!u) return 0;
  if(u.ttft>0) return u.ttft;
  if(u.prompt_ns) return (u.prompt_ns+(u.load_ns||0))/1e9;
  return u.ttft_wall||0;
}
function speedBadge(u){
  var tps=tpsOf(u);
  if(!tps) return '';
  var secs = u.wall || (u.total_ns? u.total_ns/1e9 : 0);
  var tok  = Math.round(u.eval||0);
  var ttft = ttftOf(u);
  var tip='生成速度 '+fmtTps(tps)+' tokens/秒';
  if(tok) tip+=' · 输出 '+tok+' tokens';
  if(secs) tip+=' · 耗时 '+fmtSec(secs);
  if(ttft) tip+=' · 首字 '+fmtSec(ttft);
  var meta=[];
  if(tok) meta.push(tok+' tok');
  if(secs) meta.push(fmtSec(secs));
  return '<span class="spd" title="'+esc(tip)+'">'+ICON_BOLT+
    '<b>'+fmtTps(tps)+'</b><span class="u">tok/s</span></span>'+
    (meta.length?'<span class="spd-meta">'+meta.join(' · ')+'</span>':'');
}

/* ============ 图片附件 ============ */
/* 发送前统一压缩：长边 ≤ IMG_MAX_EDGE、转 WebP/JPEG。
   原图转 base64 会再膨胀 33%，几张大图就能把请求体顶到后端上限，
   服务端会在读体阶段直接掐断连接，浏览器只能报 Failed to fetch。
   压缩后单图通常 100~400KB，既不撑爆请求体，模型预填也快很多。 */
var attachments=[];
var IMG_MAX_EDGE=1568;             // qwen2.5-VL 再放大只是白烧 token
var IMG_MAX_FILE=20*1024*1024;     // 单张原文件上限
var BODY_MAX_CHARS=20*1024*1024;   // 请求体警戒线（后端 64MB，但尽量压到 20MB 内更稳）
var IMG_TARGET_B64=1400*1024;      // 单张压缩后 base64 目标上限（约 1.4MB，对应原图约 1MB）
// 质量递减序列：先 0.86 快压，仍超目标就逐步降质，绝不回退用原图
var IMG_QUALITIES=[0.86, 0.78, 0.7, 0.62, 0.55, 0.48];

function fmtSize(n){
  if(n===undefined || n===null) return '';
  if(n < 1024) return n+' B';
  if(n < 1048576) return (n/1024).toFixed(0)+' KB';
  return (n/1048576).toFixed(1)+' MB';
}

// 压缩到 Canvas（返回 base64 dataUrl），失败返回空串
function drawToDataUrl(img, tw, th, quality, mime){
  var cv=document.createElement('canvas');
  cv.width=tw; cv.height=th;
  var ctx=cv.getContext('2d');
  if(!ctx) return '';
  ctx.fillStyle='#fff'; ctx.fillRect(0,0,tw,th);   // 透明 PNG 转 JPEG 时避免变黑
  ctx.imageSmoothingEnabled=true;
  if('imageSmoothingQuality' in ctx) ctx.imageSmoothingQuality='high';
  try{ ctx.drawImage(img,0,0,tw,th); }catch(e){ return ''; }
  var out='';
  try{ out=cv.toDataURL(mime, quality); }catch(e){ out=''; }
  if(!out || out.indexOf('data:'+mime)!==0) out='';
  return out;
}

function compressImage(file){
  return new Promise(function(resolve){
    var url;
    try{ url=URL.createObjectURL(file); }catch(e){ return resolve(null); }
    var img=new Image();
    img.onload=function(){
      var w=img.naturalWidth||img.width, h=img.naturalHeight||img.height;
      // 单图已经是小幅、已压缩格式且没超过目标体积：直接用原图，避免二次编码损失
      if(w<=IMG_MAX_EDGE && h<=IMG_MAX_EDGE && file.size<=600*1024 && /image\/(jpeg|webp)/.test(file.type||'')){
        URL.revokeObjectURL(url);
        var r=new FileReader();
        r.onload=function(){ resolve({dataUrl:r.result, bytes:file.size, raw:true}); };
        r.onerror=function(){ resolve(null); };
        r.readAsDataURL(file);
        return;
      }
      // 逐档降质重压：直到 base64 长度达标或用到最低质量
      var scale=Math.min(1, IMG_MAX_EDGE/Math.max(w,h));
      var tw=Math.max(1,Math.round(w*scale)), th=Math.max(1,Math.round(h*scale));
      var out='', q=IMG_QUALITIES[0], usedMime='image/jpeg';
      for(var i=0;i<IMG_QUALITIES.length;i++){
        q=IMG_QUALITIES[i];
        var wout=drawToDataUrl(img, tw, th, q, 'image/webp');
        if(!wout) wout=drawToDataUrl(img, tw, th, q, 'image/jpeg');
        if(!wout) break;
        out=wout; usedMime='image/webp';
        // WebP 是 jpeg 来源时 webp 可能打不开，若 webp 没产出来则退回 jpeg
        if(out.indexOf('data:image/webp')!==0) usedMime='image/jpeg';
        if(out.length <= IMG_TARGET_B64) break;
        // 仍超目标，且画布已经不小，可再降一次长边继续压
        if(i===IMG_QUALITIES.length-1 && tw>768){
          tw=Math.round(tw*0.75); th=Math.round(th*0.75);
          i--; // 用当前质量在更小画布上重压
        }
      }
      URL.revokeObjectURL(url);
      if(!out){ resolve(null); return; }
      // 压缩后仍超后端兜底线就明确失败，不让超大图进请求体
      if(out.length > BODY_MAX_CHARS){
        resolve({tooBig:true, dataUrl:'', bytes:Math.round(out.length*0.75)});
        return;
      }
      resolve({dataUrl:out, bytes:Math.round(out.length*0.75), raw:false, w:tw, h:th, ow:w, oh:h});
    };
    img.onerror=function(){ try{ URL.revokeObjectURL(url); }catch(e){} resolve(null); };
    img.src=url;
  });
}

function addFiles(files){
  var list=Array.prototype.slice.call(files||[]).filter(function(f){ return f && f.type && f.type.indexOf('image/')===0; });
  if(!list.length){ return; }
  list.forEach(function(f){
    if(f.size > IMG_MAX_FILE){ toast('图片过大（单张上限 20MB）'); return; }
    var slot=attachments.length;
    attachments.push({dataUrl:'', name:f.name||'图片', loading:true});
    renderAtt(); updateSendState();
    compressImage(f).then(function(res){
      if(!res){ attachments.splice(slot,1); renderAtt(); updateSendState(); toast('这张图片读不出来'); return; }
      if(res.tooBig){ attachments.splice(slot,1); renderAtt(); updateSendState(); toast('这张图片压缩后仍过大，已跳过（可先截图缩小再上传）'); return; }
      attachments[slot]={ dataUrl:res.dataUrl, name:f.name||'图片', bytes:res.bytes,
        w:res.w, h:res.h, raw:res.raw };
      renderAtt(); updateSendState();
    });
  });
}
function renderAtt(){
  attEl.innerHTML='';
  attachments.forEach(function(a,i){
    var d=document.createElement('div'); d.className='att'+(a.loading?' loading':'');
    d.title=(a.name||'图片')+(a.bytes?(' · '+fmtSize(a.bytes)):'')+(a.w?(' · '+a.w+'×'+a.h):'');
    d.innerHTML=(a.dataUrl? '<img src="'+a.dataUrl+'" data-full="'+a.dataUrl+'" alt="">' : '') +
      '<button class="rm" title="移除">×</button>';
    d.querySelector('.rm').addEventListener('click', function(ev){
      ev.stopPropagation(); attachments.splice(i,1); renderAtt(); updateSendState();
    });
    var im=d.querySelector('img');
    if(a.dataUrl){ im.addEventListener('click', function(){ openLightbox(a.dataUrl); }); }
    attEl.appendChild(d);
  });
}

async function send(){
  if(streaming) return;
  var text=ta.value.trim();
  if(!text && !attachments.length) return;

  if(!curId){
    curId=uid();
    sessions[curId]={ title:'新对话', ts:Date.now(), messages:[] };
    order.unshift(curId);
  }
  var s=sessions[curId];
  var imgs=attachments.map(function(a){ return a.dataUrl; });
  var history=s.messages.slice(-10).map(function(m){ return {role:m.role, content:m.content||''}; });
  var hadMsgs = s.messages.length>0;

  s.messages.push({role:'user', content:text, imgs:imgs});
  s.ts=Date.now();
  if(!s.title || s.title==='新对话'){ s.title=(text||'图片对话').slice(0,24); }

  attachments=[]; renderAtt();
  ta.value=''; autosize(); updateSendState();
  save(); renderSidebar(); syncEmpty(); updateTitle();
  if(hadMsgs){
    // 追加即可，避免整屏重绘
    var oldRegen=chatEl.querySelector('.act[data-act="regen"]');
    if(oldRegen) oldRegen.remove();
    chatEl.appendChild(msgNode(s.messages[s.messages.length-1], s.messages.length-1, s.messages.length));
  }else{
    renderChat();
  }
  autoScroll=true;
  scrollBottom(false);

  await streamReply(history, text, imgs);
}

async function streamReply(history, text, imgs, forceWeb){
  streaming=true; setSendState();
  var doWeb = (typeof forceWeb==='boolean')? forceWeb : webOn;
  var s=sessions[curId];
  var node=document.createElement('div');
  node.className='msg ai streaming';
  node.innerHTML='<div class="md"><span class="caret"></span></div>'+
    '<div class="mfoot"><span class="spd live">'+
      '<span class="pulse"></span><span class="lb">生成中</span>'+
      '<span class="sep"></span><b class="live-tps">—</b><span class="u">tok/s</span>'+
    '</span><span class="spd-meta"><span class="live-tok">0</span> tok · <span class="live-sec">0.0s</span></span></div>';
  chatEl.appendChild(node);
  var mdEl=node.querySelector('.md');
  var liveTps=node.querySelector('.live-tps'),
      liveTok=node.querySelector('.live-tok'),
      liveSec=node.querySelector('.live-sec');
  scrollBottom(false);
  updateJump();

  var acc='', raw='', timer=null, aborted=false, usage=null;
  var searchData=null, searchEl=null;
  var SEARCH_TAG='\u0000@@SEARCH@@';
  var histChars=0;
  (history||[]).forEach(function(m){ histChars += (m.content||'').length; });

  /* 实时速度计：首个字符到达时起算，200ms 采样一次，EMA 平滑 */
  var tStart=performance.now(), tFirst=0, lastT=0, lastTok=0, ema=0;
  var meterTimer=setInterval(function(){
    if(!tFirst) return;
    var now=performance.now(), el=(now-tFirst)/1000;
    liveSec.textContent=fmtSec(el);
    if(el<0.35) return;
    var tok=acc.length/1.7;
    var dt=(now-lastT)/1000;
    if(dt>0.05){
      var inst=Math.max(0,(tok-lastTok)/dt);
      ema = ema>0 ? ema*0.7+inst*0.3 : inst;
      lastT=now; lastTok=tok;
    }
    // 刚起步数据太少时先显示占位，避免出现 0.0 tok/s 这种「卡住」的观感
    liveTps.textContent = (ema>=0.5 || acc.length>=14) ? fmtTps(ema) : '—';
    liveTok.textContent=String(Math.round(tok));
  },200);

  function renderInto(live){
    mdEl.innerHTML=md(acc);
    if(!live) return;
    var c=document.createElement('span');
    c.className='caret';
    var host=mdEl.lastElementChild;
    if(host && host.tagName==='BLOCKQUOTE' && host.lastElementChild) host=host.lastElementChild;
    if(host && /^(P|LI|H1|H2|H3|H4|H5|H6|TD|TH|CODE)$/.test(host.tagName)) host.appendChild(c);
    else mdEl.appendChild(c);
  }
  function paint(){
    renderInto(streaming);
    if(autoScroll) scrollBottom(false);
  }
  function queuePaint(){
    if(timer) return;
    timer=setTimeout(function(){ timer=null; paint(); }, 42);
  }

  /* 搜索状态卡片：先占位"正在搜索"，拿到结果后原地换成来源列表 */
  function renderSearch(pending){
    if(!searchEl){
      searchEl=document.createElement('div');
      node.insertBefore(searchEl, mdEl);
    }
    searchEl.innerHTML=searchCardHTML(searchData, pending);
  }
  function consumeSearchMarks(){
    var guard=0;
    while(raw.indexOf(SEARCH_TAG)===0 && guard++<8){
      var nl=raw.indexOf('\n');
      if(nl<0) return;                 // 标记还没收全，等下一块
      var payload=raw.slice(SEARCH_TAG.length, nl);
      raw=raw.slice(nl+1);
      var d=null;
      try{ d=JSON.parse(payload); }catch(e){}
      if(!d) continue;
      if(d.stage==='searching'){
        searchData={query:d.query||'', engine:'', ms:0, sources:[], error:''};
        renderSearch(true);
        if(autoScroll) scrollBottom(false);
      }else if(d.stage==='done'){
        searchData={query:d.query||'', engine:d.engine||'', ms:d.ms||0,
                    sources:d.sources||[], error:d.error||''};
        renderSearch(false);
        if(autoScroll) scrollBottom(false);
      }
    }
  }

  try{
    var bodyStr=JSON.stringify({text:text, images:imgs, history:history,
                               num_ctx:numCtx, web:!!doWeb});
    // 先自查体积：超过后端上限时服务端会直接断开连接，浏览器只能报 Failed to fetch
    if(bodyStr.length > BODY_MAX_CHARS){
      var e0=new Error('这次请求有 '+fmtSize(Math.round(bodyStr.length*0.9))+'（图片转码后会再膨胀），超过单次上限。');
      e0.name='PayloadTooLarge';
      throw e0;
    }
    ctrl=new AbortController();
    var resp=await fetch('https://ai.lxhome.asia/chat', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: bodyStr,
      signal: ctrl.signal
    });
    if(!resp.ok){
      var er=null;
      try{ er=await resp.json(); }catch(e2){}
      throw new Error((er && er.error) || ('HTTP '+resp.status));
    }
    var reader=resp.body.getReader();
    var dec=new TextDecoder();
    while(true){
      var chunk=await reader.read();
      if(chunk.done) break;
      raw += dec.decode(chunk.value, {stream:true});
      consumeSearchMarks();          // 先吃掉开头的联网搜索标记
      // 正文末尾可能跟着 NUL 开头的用量信息，切掉后单独解析
      var uAt=raw.indexOf('\u0000@@USAGE@@');
      if(uAt>=0){
        acc=raw.slice(0,uAt);
        var brace=raw.indexOf('{', uAt);
        if(brace>=0){
          try{ usage=JSON.parse(raw.slice(brace)); }catch(e3){}
        }
      }else{
        // 还可能有没接收完整的标记，先不显示，避免闪出一串乱码
        var nul=raw.indexOf('\u0000');
        acc = nul>=0 ? raw.slice(0,nul) : raw;
      }
      if(!tFirst && acc){
        tFirst=performance.now(); lastT=tFirst; lastTok=0;
      }
      queuePaint();
    }
  }catch(err){
    if(err && err.name==='AbortError'){
      aborted=true;
      if(!acc.trim()) acc='*（已停止生成）*';
    }else if(err && err.name==='PayloadTooLarge'){
      acc='> **图片太多，已取消发送**\n>\n> '+err.message+'\n> 长边已自动压到 1568px，通常 1~3 张足够；也可以先截图缩小再发。';
    }else if(err && (err.name==='TypeError' || /Failed to fetch|network|load failed/i.test(err.message||''))){
      // 浏览器没能拿到响应：多半是请求体过大被服务端提前断开，或后端进程已退出
      acc='> **连接被中断**（未能连上本地服务）\n>\n> 常见原因：图片/消息体积过大被提前断开、或后台 `app.py` 进程已停止。\n> 可以试试：减少图片数量、重新发送，或重启 `python app.py`。';
    }else{
      var msg=(err && err.message) || '未知错误';
      acc = (acc? acc+'\n\n' : '') + '> **请求失败**：'+msg+'\n>\n> 请确认 Ollama 已启动（`ollama serve`），且已拉取 `'+MODEL_NAME+'` 模型。';
    }
  }finally{
    if(timer){ clearTimeout(timer); timer=null; }
    clearInterval(meterTimer);
    streaming=false; ctrl=null;
    mdEl.innerHTML=md(acc);
    node.classList.remove('streaming');
    setSendState();

    var clientWall = (performance.now()-tStart)/1000;
    var clientTtft = tFirst ? (tFirst-tStart)/1000 : 0;
    var msgUsage = null;
    if(usage && usage.prompt){
      s.usage={
        prompt: usage.prompt||0,
        eval: usage.eval||0,
        histChars: histChars,
        curChars: (text||'').length,
        imgs: (imgs||[]).length
      };
      msgUsage={
        prompt: usage.prompt||0,
        eval: usage.eval||0,
        prompt_ns: usage.prompt_ns||0,
        eval_ns: usage.eval_ns||0,
        load_ns: usage.load_ns||0,
        total_ns: usage.total_ns||0,
        tps: usage.tps || ema || 0,
        ttft: usage.ttft || usage.ttft_wall || clientTtft,
        wall: usage.wall || clientWall
      };
    }else if(acc.trim()){
      // 无后端用量（中断/旧版本）时用客户端测得的实时速度兜底
      var estTok = Math.round(acc.length/1.7);
      if(estTok>0){
        msgUsage = { eval: estTok, tps: ema||0, ttft: clientTtft, wall: clientWall };
      }
      if(s.usage && estTok>0){ s.usage.eval = estTok; }
    }

    if(acc.trim()){
      var assistantMsg={role:'assistant', content:acc, usage: msgUsage};
      if(searchData) assistantMsg.search=searchData;
      s.messages.push(assistantMsg);
      s.ts=Date.now();
      save();
      updateUsagePill();
      if(usagePanel.classList.contains('show')) renderUsage();
      if(node.parentNode===chatEl){
        // 就地替换为正式气泡，避免整屏重绘造成的闪烁
        var nn=msgNode(s.messages[s.messages.length-1], s.messages.length-1, s.messages.length);
        nn.classList.add('no-anim');
        node.replaceWith(nn);
        if(autoScroll) scrollBottom(false);
        updateJump();
      }else{
        renderChat();
      }
    }else{
      node.remove();
    }
    renderSidebar();
    if(aborted) toast('已停止生成');
  }
}

function regenerate(){
  if(streaming || !curId) return;
  var s=sessions[curId];
  var i=-1;
  for(var k=s.messages.length-1;k>=0;k--){ if(s.messages[k].role==='user'){ i=k; break; } }
  if(i<0) return;
  var u=s.messages[i];
  var prevA=s.messages[i+1];      // 被替换掉的那条回复，用来沿用搜索设置
  var history=s.messages.slice(0,i).slice(-10).map(function(m){ return {role:m.role, content:m.content||''}; });
  s.messages=s.messages.slice(0,i);
  s.messages.push(u);
  s.ts=Date.now(); save(); renderChat();
  streamReply(history, u.content||'', u.imgs||[], prevA && prevA.search ? true : undefined);
}

/* ============ 上下文用量 ============ */
var CTX_STEPS=[4096,8192,16384,32768];
var CTX_LABEL={4096:'4K',8192:'8K',16384:'16K',32768:'32K'};
var ctxIdx=(function(){
  var v=parseInt(localStorage.getItem('qvl_ctx_idx'),10);
  return (isNaN(v)||v<0||v>CTX_STEPS.length-1)?1:v;
})();
var numCtx=CTX_STEPS[ctxIdx];
var SYS_CHARS=0, ollamaOff=false;
var RING_C=43.98;
var CATS=[
  {key:'sys', name:'系统提示词', color:'#5B5BD6'},
  {key:'hist',name:'历史消息',   color:'#00C08B'},
  {key:'cur', name:'本轮输入',   color:'#F5A11E'},
  {key:'img', name:'图片输入',   color:'#8B5CF6'},
  {key:'eval',name:'模型回复',   color:'#FF4D8D'}
];

function fmtTok(v){
  v=Math.round(v||0);
  if(v>=1000){
    var s=(v/1024).toFixed(1);
    return s+'K';
  }
  return String(v);
}
function fmtPct(v){
  if(!v || v<0.05) return '0%';
  var s=v.toFixed(1);
  if(s.slice(-2)==='.0') s=s.slice(0,-2);
  return s+'%';
}
function computeUsage(){
  var s=curId && sessions[curId];
  var u=(s && s.usage) || null;
  var p=u?u.prompt:0, e=u?u.eval:0;
  var raw={
    sys:(SYS_CHARS||0)*0.62,
    hist:(u?u.histChars:0)*0.62,
    cur:(u?u.curChars:0)*0.62,
    img:(u?u.imgs:0)*1024
  };
  var sum=raw.sys+raw.hist+raw.cur+raw.img;
  var k=(p>0 && sum>0)? p/sum : 0;
  var order=['sys','hist','cur','img'];
  var vals=order.map(function(k2){ return raw[k2]*k; });
  var rounded=vals.map(function(v){ return Math.round(v); });
  var diff=Math.round(p)-rounded.reduce(function(a,b){ return a+b; },0);
  if(diff!==0 && rounded.length){
    var maxI=0;
    for(var i=1;i<rounded.length;i++){ if(rounded[i]>rounded[maxI]) maxI=i; }
    rounded[maxI]=Math.max(0, rounded[maxI]+diff);
  }
  return {
    map:{sys:rounded[0], hist:rounded[1], cur:rounded[2], img:rounded[3], eval:Math.round(e)},
    used:Math.round(p)+Math.round(e),
    ctx:numCtx
  };
}
function updateUsagePill(){
  if(ollamaOff){
    ringFg.setAttribute('stroke-dashoffset','0');
    ringFg.style.stroke='#F04438';
    return;
  }
  var c=computeUsage();
  var pct=c.ctx? Math.min(100, c.used/c.ctx*100) : 0;
  ringFg.setAttribute('stroke-dashoffset', String(RING_C*(1-pct/100)));
  ringFg.style.stroke = pct>90? '#F04438' : (pct>70? '#F5A21E' : '');
  $('#pctx').textContent = pct>0? fmtPct(pct) : '0%';
}
function latestUsage(){
  var s=curId && sessions[curId];
  if(!s) return null;
  for(var i=s.messages.length-1;i>=0;i--){
    var m=s.messages[i];
    if(m.role==='assistant' && m.usage) return m.usage;
  }
  return null;
}
function renderUsage(){
  var c=computeUsage();
  var pct=c.ctx? c.used/c.ctx*100 : 0;
  $('#upPct').textContent = pct>0? fmtPct(Math.min(pct,999)) : '0%';
  $('#upUsed').textContent = fmtTok(c.used);
  $('#upTotal').textContent = fmtTok(c.ctx);

  var html='';
  CATS.forEach(function(cat){
    var v=c.map[cat.key]||0;
    if(v<=0) return;
    var w=Math.max(0.7, Math.min(100, v/c.ctx*100));
    html+='<i style="width:'+w.toFixed(3)+'%;background:'+cat.color+'"></i>';
  });
  $('#upBar').innerHTML=html;

  $('#upLegend').innerHTML=CATS.map(function(cat){
    var v=c.map[cat.key]||0;
    var r=c.ctx? v/c.ctx*100 : 0;
    return '<div class="up-row"><span class="dot" style="background:'+cat.color+'"></span>'+
      '<span class="nm">'+cat.name+'</span><span class="vl">'+fmtPct(r)+'</span></div>';
  }).join('');

  // 本次生成速度
  var u=latestUsage();
  var tps=tpsOf(u), ttft=ttftOf(u);
  $('#spTps').innerHTML = tps? fmtTps(tps)+'<em>tok/s</em>' : '—';
  $('#spEval').innerHTML = (u && u.eval)? String(Math.round(u.eval))+'<em>tok</em>' : '—';
  $('#spTtft').innerHTML = ttft? fmtSec(ttft) : '—';
  $('#upSpeedTag').textContent = u && u.eval? (MODEL_NAME||'本地模型') : '等待生成';

  $('#upFoot').textContent = CTX_LABEL[c.ctx]+' 上下文 · '+(ctxIdx===1?'默认':'自定义');
  var rng=$('#ctxRange');
  rng.max=String(CTX_STEPS.length-1);
  rng.value=String(ctxIdx);
}
function closeUsage(){ usagePanel.classList.remove('show'); }
usageBtn.addEventListener('click', function(e){
  e.stopPropagation();
  if(usagePanel.classList.contains('show')){ closeUsage(); return; }
  renderUsage();
  usagePanel.classList.add('show');
});
$('#upClose').addEventListener('click', closeUsage);
document.addEventListener('mousedown', function(e){
  if(!usagePanel.classList.contains('show')) return;
  if(usagePanel.contains(e.target) || usageBtn.contains(e.target)) return;
  closeUsage();
});
var ctxRange=$('#ctxRange');
ctxRange.addEventListener('input', function(e){
  ctxIdx=parseInt(e.target.value,10)||0;
  numCtx=CTX_STEPS[ctxIdx];
  try{ localStorage.setItem('qvl_ctx_idx', String(ctxIdx)); }catch(e2){}
  renderUsage(); updateUsagePill();
});
ctxRange.addEventListener('change', function(){
  toast(CTX_LABEL[numCtx]+' 上下文已设置，下一条消息生效');
});

var MODEL_NAME='qwen2.5vl:7b';
function checkStatus(){
  fetch('https://ai.lxhome.asia/api/status').then(function(r){ return r.json(); }).then(function(d){
    var dot=$('#footDot'), txt=$('#statusText');
    if(d && d.ok){
      ollamaOff=false;
      usageBtn.classList.remove('off');
      dot.classList.remove('off');
      if(d.model) MODEL_NAME=d.model;
      txt.textContent=d.model||MODEL_NAME;
      $('#footModel').textContent=d.model||MODEL_NAME;
      if(typeof d.system_chars==='number') SYS_CHARS=d.system_chars;
      usageBtn.title = (d.available===false)
        ? 'Ollama 已连接，但本地未找到该模型'
        : '上下文用量 · 点击查看';
    }else{
      ollamaOff=true;
      usageBtn.classList.add('off'); dot.classList.add('off');
      usageBtn.title='未连接 Ollama';
    }
    updateUsagePill();
    if(usagePanel.classList.contains('show')) renderUsage();
  }).catch(function(){});
}

/* ============ 移动端：可视视口 / 键盘适配 ============ */
(function fitViewport(){
  var vv=window.visualViewport;
  function apply(){
    if(!vv || window.innerWidth>860){
      document.body.style.height='';
      return;
    }
    // 仅在键盘弹出时接管高度：视觉视口明显变矮，跟随它，避免输入框被键盘挡住
    var kbOpen = vv.height < window.innerHeight - 120;
    if(kbOpen){
      document.body.style.height=Math.round(vv.height)+'px';
      try{ window.scrollTo(0,0); }catch(e){}
    }else{
      document.body.style.height='';
    }
  }
  if(vv){
    vv.addEventListener('resize', apply);
    vv.addEventListener('scroll', apply);
  }
  window.addEventListener('resize', apply);
  window.addEventListener('orientationchange', function(){ setTimeout(apply, 150); });
  apply();
})();
// 移动端侧边栏支持边缘滑动
(function edgeSwipe(){
  var sb=document.getElementById('sidebar'), bd=backdrop;
  var x0=0, y0=0, tracking=false;
  document.addEventListener('touchstart', function(e){
    if(!isMobile() || !e.touches.length) return;
    var t=e.touches[0];
    var open=sb.classList.contains('open');
    // 关闭态：从左边缘起手；展开态：任意位置横向右滑
    tracking = open ? true : (t.clientX<24);
    x0=t.clientX; y0=t.clientY;
  }, {passive:true});
  document.addEventListener('touchend', function(e){
    if(!tracking || !e.changedTouches.length){ tracking=false; return; }
    tracking=false;
    var t=e.changedTouches[0];
    var dx=t.clientX-x0, dy=Math.abs(t.clientY-y0);
    if(dy>Math.abs(dx) || Math.abs(dx)<48) return;
    if(!sb.classList.contains('open') && dx>0){
      sb.classList.add('open'); bd.classList.add('show');
    }else if(sb.classList.contains('open') && dx<0){
      closeSidebar();
    }
  }, {passive:true});
})();

renderAll();
autosize();
updateSendState();
checkStatus();
setTimeout(function(){ ta.focus(); }, 60);

window.addEventListener('beforeunload', save);
