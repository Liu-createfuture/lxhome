<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#f2f0ea" />
    <title>冒险岛 · 游戏大厅</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230e7490'/%3E%3Ctext x='32' y='45' font-size='32' text-anchor='middle' fill='white'%3E%F0%9F%8F%9D%EF%B8%8F%3C/text%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="styles.css?v=20261029-3" />
    <link rel="stylesheet" href="../ui.css?v=20261029-3" />
  </head>
  <body class="gs" data-page="adventure">
    <div class="app">
      <header class="topbar">
        <a class="back-home" href="../" title="返回游戏大厅">← 大厅</a>
        <div class="brand">
          <div class="logo">岛</div>
          <div class="brand-text">
            <h1>冒险岛</h1>
            <p>跳过峡谷，踩扁怪物，走到终点</p>
          </div>
        </div>
        <div class="hud">
          <div class="stat">
            <span id="stageName">第 1 关</span>
            <b id="stageValue">青草坡</b>
          </div>
          <div class="stat">
            <span>金币</span>
            <b><i class="coin-dot"></i><span id="coins">0</span></b>
          </div>
          <div class="stat">
            <span>生命</span>
            <b id="lives">3</b>
          </div>
        </div>
      </header>

      <main class="stage">
        <div class="canvas-wrap" id="canvasWrap">
          <canvas id="game"></canvas>
          <div class="hint" id="hint">← → 移动 · 空格 / ↑ 跳</div>
          <div class="flash" id="flash"></div>
        </div>

        <div class="touch" id="touch">
          <div class="pad">
            <button class="tbtn" data-key="left" aria-label="左">←</button>
            <button class="tbtn" data-key="right" aria-label="右">→</button>
          </div>
          <button class="tbtn jump" data-key="jump" aria-label="跳">跳</button>
        </div>

        <p class="tip">← → 或 A D 移动 · 空格 / ↑ 跳 · 踩怪物头顶可以消灭它 · 掉进峡谷会损失生命</p>
      </main>

      <footer class="page-foot">
        <span>进度保存在这台设备上</span>
        <a href="../">← 回大厅</a>
      </footer>
    </div>

    <div class="modal" id="modal" aria-hidden="true">
      <div class="modal-card">
        <div class="modal-emoji" id="moEmoji">🏁</div>
        <h2 id="moTitle">过关！</h2>
        <p id="moText">收集了 0 枚金币</p>
        <div class="modal-actions">
          <button class="btn primary" id="moMain">下一关</button>
          <button class="btn" id="moAlt">重玩本关</button>
        </div>
      </div>
    </div>

    <div class="toast-stack" id="toasts"></div>

    <script src="game.js?v=20261029-3"></script>
  </body>
</html>
